<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Signature Luxury Gold Gradient (4 stops for radiant metallic depth) -->
    <linearGradient id="aetherGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae5b0"/>
      <stop offset="28%" stop-color="#dfba73"/>
      <stop offset="68%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#8d6823"/>
    </linearGradient>

    <!-- Metallic Rim Highlight Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#fae5b0" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#c5a059" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2a1a03" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Subtle Inner Glow for 3D Specular Sheen -->
    <radialGradient id="specularGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </radialGradient>

    <!-- Drop Shadow Filter for floating contrast on both Dark & Light browser tabs -->
    <filter id="tabElevation" x="-12%" y="-12%" width="128%" height="128%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#936f2b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Floating Glow / Shadow Base -->
  <rect x="26" y="26" width="460" height="460" rx="112" ry="112" fill="url(#aetherGold)" filter="url(#tabElevation)"/>

  <!-- Specular 3D Lighting Overlay -->
  <rect x="26" y="26" width="460" height="460" rx="112" ry="112" fill="url(#specularGlow)"/>

  <!-- Crisp Outer Contour Border -->
  <rect x="26" y="26" width="460" height="460" rx="112" ry="112" fill="none" stroke="#251805" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Primary Beveled Metallic Rim -->
  <rect x="34" y="34" width="444" height="444" rx="104" ry="104" fill="none" stroke="url(#rimGrad)" stroke-width="6"/>

  <!-- Bespoke Trunk Pin-Stripe Inner Border -->
  <rect x="46" y="46" width="420" height="420" rx="92" ry="92" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5" stroke-dasharray="6 3"/>

  <!-- Monogram Æ Glyph with Subtle Relief Drop Shadow -->
  <!-- Shadow for micro-relief -->
  <text x="256" y="346" 
        font-family="'Cinzel', 'Playfair Display', 'Bodoni MT', 'Didot', 'Times New Roman', Georgia, serif" 
        font-weight="900" 
        font-size="280" 
        text-anchor="middle" 
        fill="#ffffff" 
        fill-opacity="0.3" 
        letter-spacing="-2px">Æ</text>

  <!-- Main Monogram in Deep Obsidian Navy-Black -->
  <text x="256" y="343" 
        font-family="'Cinzel', 'Playfair Display', 'Bodoni MT', 'Didot', 'Times New Roman', Georgia, serif" 
        font-weight="900" 
        font-size="280" 
        text-anchor="middle" 
        fill="#07090e" 
        letter-spacing="-2px">Æ</text>
</svg>
