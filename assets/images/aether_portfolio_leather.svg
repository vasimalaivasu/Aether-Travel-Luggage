<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e2430"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </radialGradient>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c67d3b"/>
      <stop offset="40%" stop-color="#9d5a22"/>
      <stop offset="80%" stop-color="#733d12"/>
      <stop offset="100%" stop-color="#4d2708"/>
    </linearGradient>
    <linearGradient id="leatherFoldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a66228"/>
      <stop offset="100%" stop-color="#6e3910"/>
    </linearGradient>
    <linearGradient id="goldZipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eed58f"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#8c6a27"/>
    </linearGradient>
    <linearGradient id="passportNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d3557"/>
      <stop offset="100%" stop-color="#0b1b30"/>
    </linearGradient>
    <linearGradient id="passportBurgundy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b1d2f"/>
      <stop offset="100%" stop-color="#3b0813"/>
    </linearGradient>
    <linearGradient id="boardingPassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8ecf2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Studio Podium -->
  <rect width="800" height="800" fill="none"/>
  <ellipse cx="400" cy="680" rx="320" ry="60" fill="#000000" opacity="0.45" filter="blur(20px)"/>
  <circle cx="400" cy="380" r="280" fill="#c5a059" opacity="0.04" filter="blur(50px)"/>

  <!-- Main Leather Portfolio Body (Open Layout Display) -->
  <g filter="url(#shadow)">
    <!-- Back Cover Shadow & Edge -->
    <rect x="140" y="160" width="520" height="460" rx="28" fill="#381d06"/>
    
    <!-- Main Left & Right Wings (Open Folio) -->
    <!-- Left Wing (Passports & Card Vault) -->
    <rect x="145" y="165" width="250" height="450" rx="24" fill="url(#leatherGrad)" stroke="#eed58f" stroke-width="1.5" stroke-opacity="0.3"/>
    <!-- Right Wing (iPad & Tech Pouch) -->
    <rect x="405" y="165" width="250" height="450" rx="24" fill="url(#leatherFoldGrad)" stroke="#eed58f" stroke-width="1.5" stroke-opacity="0.3"/>

    <!-- Spine Center Channel & Stitching -->
    <rect x="390" y="165" width="20" height="450" fill="#2d1704"/>
    <line x1="395" y1="175" x2="395" y2="605" stroke="#eed58f" stroke-dasharray="4,4" stroke-width="1.5" opacity="0.6"/>
    <line x1="405" y1="175" x2="405" y2="605" stroke="#eed58f" stroke-dasharray="4,4" stroke-width="1.5" opacity="0.6"/>

    <!-- Perimeter Stitching Details -->
    <rect x="155" y="175" width="230" height="430" rx="18" fill="none" stroke="#eed58f" stroke-dasharray="5,4" stroke-width="1.2" opacity="0.5"/>
    <rect x="415" y="175" width="230" height="430" rx="18" fill="none" stroke="#eed58f" stroke-dasharray="5,4" stroke-width="1.2" opacity="0.5"/>

    <!-- Left Wing Interior Components -->
    <!-- Passports in Tiered Pockets -->
    <!-- Passport 1 (Navy Blue Gold Foil) -->
    <g transform="translate(170, 205)">
      <rect width="165" height="110" rx="8" fill="url(#passportNavy)" stroke="#eed58f" stroke-width="0.75"/>
      <circle cx="82" cy="45" r="16" fill="none" stroke="#eed58f" stroke-width="1.2" opacity="0.85"/>
      <polygon points="82,35 85,42 92,43 87,48 88,55 82,51 76,55 77,48 72,43 79,42" fill="#eed58f" opacity="0.85"/>
      <text x="82" y="78" font-family="'Cinzel', serif" font-size="9" fill="#eed58f" text-anchor="middle" font-weight="700" letter-spacing="2">PASSPORT</text>
    </g>

    <!-- Passport 2 (Burgundy Gold Foil) -->
    <g transform="translate(170, 280)">
      <rect width="180" height="110" rx="8" fill="url(#passportBurgundy)" stroke="#eed58f" stroke-width="0.75"/>
      <circle cx="90" cy="42" r="14" fill="none" stroke="#eed58f" stroke-width="1.2" opacity="0.85"/>
      <text x="90" y="72" font-family="'Cinzel', serif" font-size="8.5" fill="#eed58f" text-anchor="middle" font-weight="700" letter-spacing="1.5">ROYAL PASSPORT</text>
    </g>

    <!-- Boarding Pass Sticking Out -->
    <g transform="translate(195, 140) rotate(-6)">
      <rect width="160" height="75" rx="6" fill="url(#boardingPassGrad)" stroke="#c5a059" stroke-width="1" filter="url(#shadow)"/>
      <rect x="0" y="0" width="160" height="16" fill="#1d3557" rx="6"/>
      <text x="12" y="11" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#ffffff" font-weight="800">FIRST CLASS · VIP VOYAGE</text>
      <text x="12" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#0b0e14" font-weight="800">ZURICH ➔ PARIS</text>
      <text x="12" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#64748b">FLIGHT AV-801 · SEAT 01A</text>
      <!-- Mini Barcode -->
      <line x1="12" y1="54" x2="12" y2="68" stroke="#000" stroke-width="2"/>
      <line x1="16" y1="54" x2="16" y2="68" stroke="#000" stroke-width="1"/>
      <line x1="19" y1="54" x2="19" y2="68" stroke="#000" stroke-width="3"/>
      <line x1="24" y1="54" x2="24" y2="68" stroke="#000" stroke-width="1.5"/>
      <line x1="28" y1="54" x2="28" y2="68" stroke="#000" stroke-width="2"/>
      <line x1="33" y1="54" x2="33" y2="68" stroke="#000" stroke-width="1"/>
      <line x1="36" y1="54" x2="36" y2="68" stroke="#000" stroke-width="3"/>
    </g>

    <!-- Credit Card / Lounge Key Slots -->
    <g transform="translate(170, 390)">
      <rect x="0" y="0" width="200" height="38" rx="6" fill="#5a2f0c" stroke="#eed58f" stroke-width="0.75"/>
      <text x="12" y="24" font-family="'Cinzel', serif" font-size="8" fill="#eed58f" font-weight="700">AETHER CENTURION · 8820</text>
      
      <rect x="0" y="46" width="200" height="38" rx="6" fill="#422207" stroke="#eed58f" stroke-width="0.75"/>
      <text x="12" y="70" font-family="'Cinzel', serif" font-size="8" fill="#eed58f" font-weight="700">PRIORITY PASS · FIRST LOUNGE</text>

      <rect x="0" y="92" width="200" height="38" rx="6" fill="#301703" stroke="#eed58f" stroke-width="0.75"/>
      <text x="12" y="116" font-family="'Cinzel', serif" font-size="8" fill="#eed58f" font-weight="700">WORLD CITIZEN VAULT</text>
    </g>

    <!-- Right Wing: Padded iPad / Tablet Sleeve & Pen -->
    <!-- iPad Device in Sleeve -->
    <g transform="translate(430, 205)">
      <rect width="200" height="280" rx="14" fill="#111620" stroke="#334155" stroke-width="2"/>
      <rect x="8" y="8" width="184" height="264" rx="10" fill="#0f172a"/>
      <!-- Tablet Screen Ambient Graphic -->
      <circle cx="100" cy="140" r="50" fill="#c5a059" opacity="0.15" filter="blur(15px)"/>
      <text x="100" y="135" font-family="'Cinzel', serif" font-size="14" fill="#eed58f" text-anchor="middle" font-weight="700">AETHER OS</text>
      <text x="100" y="155" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Transatlantic Flight Telemetry</text>
      
      <!-- Leather Retention Sleeve Front Flap -->
      <path d="M0,180 Q100,210 200,180 L200,280 L0,280 Z" fill="#7a3f12" stroke="#eed58f" stroke-width="1"/>
      <line x1="8" y1="270" x2="192" y2="270" stroke="#eed58f" stroke-dasharray="4,4" stroke-width="1.2" opacity="0.6"/>
    </g>

    <!-- Gold Apple Pencil / Stylus Holder in Middle -->
    <g transform="translate(393, 260)">
      <rect width="14" height="210" rx="7" fill="url(#goldZipGrad)" stroke="#523908" stroke-width="1"/>
      <rect x="3" y="15" width="8" height="15" rx="2" fill="#ffffff" opacity="0.7"/>
    </g>

    <!-- Gold Monogram Crest Bottom Right -->
    <g transform="translate(530, 520)">
      <circle cx="35" cy="35" r="28" fill="#2d1704" stroke="url(#goldZipGrad)" stroke-width="2"/>
      <text x="35" y="44" font-family="'Cinzel', serif" font-size="22" fill="url(#goldZipGrad)" text-anchor="middle" font-weight="800">Æ</text>
      <text x="35" y="75" font-family="'Cinzel', serif" font-size="7" fill="#eed58f" text-anchor="middle" letter-spacing="2">ATELIER ZURICH</text>
    </g>

    <!-- Heavy Brass Perimeter Teeth & Slider Puller -->
    <path d="M135,160 L665,160" stroke="url(#goldZipGrad)" stroke-width="6" stroke-dasharray="3,2"/>
    <path d="M665,160 L665,620" stroke="url(#goldZipGrad)" stroke-width="6" stroke-dasharray="3,2"/>
    <path d="M665,620 L135,620" stroke="url(#goldZipGrad)" stroke-width="6" stroke-dasharray="3,2"/>
    <path d="M135,620 L135,160" stroke="url(#goldZipGrad)" stroke-width="6" stroke-dasharray="3,2"/>

    <!-- Gold Engraved Zipper Pull -->
    <g transform="translate(650, 220)">
      <rect x="0" y="0" width="18" height="36" rx="4" fill="url(#goldZipGrad)" stroke="#4d3505" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="9" cy="8" r="4" fill="#2d1704"/>
      <text x="9" y="26" font-family="'Cinzel', serif" font-size="10" fill="#2d1704" text-anchor="middle" font-weight="900">Æ</text>
    </g>
  </g>
</svg>